<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Obrázek</title>
<style>
  :root {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }
  /* Pro zobrazeni CELEHO obrazku bez orezu (s cernymi pruhy),
     zmen radek vyse "object-fit: cover" na "object-fit: contain" */

  .error {
    color: #aaa;
    font-family: -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img id="photo" alt="">
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const soubor = params.get('img') || '1.jpg';
    const img = document.getElementById('photo');

    img.onerror = function () {
      document.querySelector('.wrap').innerHTML =
        '<div class="error">Obrázek "' + soubor + '" nebyl nalezen.<br>Zkontroluj název souboru </div>';
    };

    img.src = soubor;
  </script>
</body>
</html>
