<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Obrázek</title>
<style>
  :root {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;
  }

  /* Na výškovém displeji pootočíme celý obsah o 90°,
     aby se obrázek "na šířku" zobrazil jako na otočeném telefonu naležato */
  @media (orientation: portrait) {
    .wrap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100vh;
      height: 100vw;
      transform: translate(-50%, -50%) rotate(90deg);
    }
  }

  .error {
    color: #aaa;
    font-family: -apple-system, sans-serif;
    text-align: center;
    padding: 20px;
  }
</style>
</head>
<body>
  <div class="wrap">
    <img id="photo" alt="">
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const soubor = params.get('img') || '1.jpg';
    const img = document.getElementById('photo');

    img.onerror = function () {
      document.querySelector('.wrap').innerHTML =
        '<div class="error">Obrázek "' + soubor + '" nebyl nalezen.</div>';
    };

    img.src = soubor;
  </script>
</body>
</html>
